# https://papers.neurips.cc/paper_files/paper/2025/file/20a917f77773ac0fa8bea2bdd6606b66-Paper-Conference.pdf
reve:
  preprocessing:
    filter:
      highpass: 0.5
      lowpass: 99.5
      order: 3
    resample:
      sf: 200
    normalize: 
      zscore
    clip_std:
        scale: 15

# https://arxiv.org/pdf/2412.07236
cbramod:
  preprocessing:
    filter:
      highpass: 0.3
      lowpass: 75
      order: 3
    resample:
      sf: 200
    normalize: 
        remap:
          min: -1
          max: 1

# https://arxiv.org/pdf/2601.06429
unishape:
  preprocessing:
    filter:
      highpass: 0.5
      lowpass: 75
      order: 3
    resample:
      sf: 200
    normalize:
        remap:
          min: -1
          max: 1